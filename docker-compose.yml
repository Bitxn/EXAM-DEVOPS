services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    networks:
      - hospital-net

  flask-api:
    build: .
    environment:
      DB_HOST: db
      DB_PASSWORD: secret
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - hospital-net

networks:
  hospital-net:
    driver: bridge
